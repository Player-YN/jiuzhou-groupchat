<svg xmlns="http://www.w3.org/2000/svg"
     width="1280" height="640" viewBox="0 0 1280 640"
     role="img" aria-labelledby="title desc">
  <title id="title">Jiuzhou Group Chat</title>
  <desc id="desc">Six-NPC persistent group-chat social sim. Deterministic rules pick 0-2 speakers. Silence is allowed.</desc>

  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A2620"/>
      <stop offset="50%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#161410"/>
    </linearGradient>
    <radialGradient id="goldhaze" cx="70%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#C7A969" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C7A969" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#ink)"/>
  <rect width="1280" height="640" fill="url(#goldhaze)"/>
  <rect x="48" y="48" width="1184" height="544" rx="20" fill="none" stroke="#C7A969" stroke-opacity="0.28"/>

  <g font-family="Segoe UI, PingFang SC, sans-serif">
    <text x="88" y="140" fill="#C7A969" font-size="20" letter-spacing="4">PERSISTENT SOCIAL SIM</text>
    <text x="88" y="220" fill="#E8E1D4" font-size="58" font-weight="700">Jiuzhou Group Chat</text>
    <text x="88" y="278" fill="#A8A095" font-size="26">One human + six fixed novel characters.</text>
    <text x="88" y="318" fill="#A8A095" font-size="26">Rules pick 0–2 speakers. Silence is allowed.</text>

    <rect x="88" y="368" width="220" height="42" rx="10" fill="#2A2620" stroke="#C7A969" stroke-opacity="0.4"/>
    <text x="198" y="396" text-anchor="middle" fill="#C7A969" font-size="18">not round-robin</text>

    <rect x="322" y="368" width="250" height="42" rx="10" fill="#2A2620" stroke="#C7A969" stroke-opacity="0.4"/>
    <text x="447" y="396" text-anchor="middle" fill="#C7A969" font-size="18">no A/V signaling</text>

    <text x="88" y="540" fill="#6B655A" font-family="Consolas, ui-monospace, monospace" font-size="20">github.com/Player-YN/jiuzhou-groupchat</text>
  </g>

  <g font-family="Segoe UI, PingFang SC, sans-serif">
    <text x="780" y="140" fill="#6B655A" font-family="Consolas, ui-monospace, monospace" font-size="16">DECIDE() · MAX 2</text>

    <rect x="780" y="168" width="184" height="70" rx="10" fill="#161410" stroke="#C7A969" stroke-opacity="0.18"/>
    <text x="872" y="198" text-anchor="middle" fill="#E8E1D4" font-size="18">Shu-hang</text>
    <text x="872" y="220" text-anchor="middle" fill="#6B655A" font-size="14">silent</text>

    <rect x="976" y="168" width="184" height="70" rx="10" fill="#161410" stroke="#C7A969" stroke-opacity="0.18"/>
    <text x="1068" y="198" text-anchor="middle" fill="#E8E1D4" font-size="18">Yao-shi</text>
    <text x="1068" y="220" text-anchor="middle" fill="#6B655A" font-size="14">silent</text>

    <rect x="780" y="250" width="184" height="70" rx="10" fill="#2A2620" stroke="#C7A969"/>
    <text x="872" y="280" text-anchor="middle" fill="#E8E1D4" font-size="18">San-lang</text>
    <text x="872" y="302" text-anchor="middle" fill="#C7A969" font-size="14">speak</text>

    <rect x="976" y="250" width="184" height="70" rx="10" fill="#161410" stroke="#C7A969" stroke-opacity="0.18"/>
    <text x="1068" y="280" text-anchor="middle" fill="#E8E1D4" font-size="18">Bei-he</text>
    <text x="1068" y="302" text-anchor="middle" fill="#6B655A" font-size="14">silent</text>

    <rect x="780" y="332" width="184" height="70" rx="10" fill="#2A2620" stroke="#C7A969"/>
    <text x="872" y="362" text-anchor="middle" fill="#E8E1D4" font-size="18">Bai-qianbei</text>
    <text x="872" y="384" text-anchor="middle" fill="#C7A969" font-size="14">speak</text>

    <rect x="976" y="332" width="184" height="70" rx="10" fill="#161410" stroke="#C7A969" stroke-opacity="0.18"/>
    <text x="1068" y="362" text-anchor="middle" fill="#E8E1D4" font-size="18">Ling-die</text>
    <text x="1068" y="384" text-anchor="middle" fill="#6B655A" font-size="14">silent</text>
  </g>
</svg>
