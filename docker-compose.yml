version: "3.9"

# 项目 B - Group Chat 多 LLM 头脑风暴
# 一键起前后端（Stage 7 起加上 Letta v0.16.8 + pgvector）
#
# 容器组合（4 个）：
#   backend    : FastAPI + LangGraph + Letta client (port 8000)
#   frontend   : Next.js 15 dev server            (port 3000)
#   letta      : letta/letta:latest v0.16.8       (port 8283)
#   postgres   : pgvector/pgvector:pg16            (port 5432, internal)
#
# 启动顺序：postgres health → letta health → backend ready → frontend
#
# 启动：
#   docker compose up --build
# 健康检查：
#   curl http://localhost:8000/health
#   curl http://localhost:8000/api/health
#   curl -u letta:letta_dev_password http://localhost:8283/v1/health

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: groupchat-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      # Stage 7: BFF 容器里 Letta base URL 指向同 stack 的 letta 服务
      - LETTA_BASE_URL=http://letta:8283
      - LETTA_API_KEY=letta_dev_password
      # 默认 leaf LLM：可改 LETTA_LLM_MODEL；空则用 .env 的值
      # 离线开发：USE_MOCK_LLM=true + USE_LETTA=false（mock 优先）
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      letta:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: groupchat-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev

  # ===== Stage 7: Letta v0.16.8 服务 + pgvector pg16 =====
  # 镜像来源（DaoCloud 镜像加速，避开 GFW）：
  #   - letta/letta:latest   → docker.m.daocloud.io/library/letta/letta:latest
  #   - pgvector/pgvector:pg16 → docker.m.daocloud.io/pgvector/pgvector:pg16
  # 我们用 docker.io 直连（已在 Project A 验证可拉取 + 启动），无需 DaoCloud 镜像。
  # 若网络拉取失败，把 image 改成对应的 daoCloud mirror。
  letta:
    image: letta/letta:latest
    container_name: groupchat-letta
    hostname: letta
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LETTA_SERVER_PASSWORD: ${LETTA_API_KEY:-letta_dev_password}
      LETTA_PG_URI: postgresql://letta:${LETTA_PG_PASSWORD:-letta_dev_password}@postgres:5432/letta
      # Stage 7 NPC 创建时使用的模型 handle。
      # 默认 openai/gpt-4o-mini — 若没有 OPENAI_API_KEY 会创建失败，
      # 可改为本地 ollama 句柄（LETTA_LLM_MODEL=ollama/qwen2.5:1.5b）
      # 或别的兼容 provider。
      LETTA_LLM_MODEL: ${LETTA_LLM_MODEL:-openai/gpt-4o-mini}
      LETTA_DEBUG: "True"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8283:8283"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-u", "letta:${LETTA_API_KEY:-letta_dev_password}", "http://localhost:8283/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - groupchat-net

  postgres:
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: groupchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: letta
      POSTGRES_PASSWORD: ${LETTA_PG_PASSWORD:-letta_dev_password}
      POSTGRES_DB: letta
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letta -d letta"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - groupchat-net

  # 可选：本地 LLM 提供方（节省 API key；用 --profile local 拉起）
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: groupchat-ollama
  #   profiles: ["local"]
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

networks:
  groupchat-net:
    driver: bridge
    name: groupchat-net

volumes:
  frontend_node_modules:
  postgres-data:
    name: groupchat-postgres-data
  # ollama_data: